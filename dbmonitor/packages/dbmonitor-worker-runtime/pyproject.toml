[project]
name = "dbmonitor-worker-runtime"
version = "2.0.0"
description = "Worker runtime: plugin loader, Inventory API client, credential/connection caches, deadline and result publishing"
requires-python = ">=3.11"
dependencies = ["dbmonitor-common>=2.0", "dbmonitor-sdk>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
